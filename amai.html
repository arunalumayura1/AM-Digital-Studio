
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AM Digital AI | AM Digital Studio</title>
    <meta name="description" content="AM Digital AI - Your intelligent AI assistant by AM Digital Studio.">

    <link rel="icon" type="image/png" href="wdf.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="amai.css">
</head>

<body>

    <header class="ai-header">
        <a href="index.html" class="brand">
            <span class="brand-icon">
                <i class="fas fa-robot"></i>
            </span>

            <span>
                <strong>AM Digital AI</strong>
                <small>By AM Digital Studio</small>
            </span>
        </a>

        <div class="header-actions">
            <button id="themeToggle" class="icon-button" title="Change Theme">
                <i class="fas fa-moon"></i>
            </button>

            <a href="index.html" class="home-btn">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
        </div>
    </header>


    <main class="ai-container">

        <section class="chat-section">

            <div class="chat-top">
                <div class="ai-profile">
                    <div class="ai-avatar">
                        <i class="fas fa-robot"></i>
                    </div>

                    <div>
                        <h2>AM Digital AI</h2>
                        <p>
                            <span class="online-dot"></span>
                            AI Assistant
                        </p>
                    </div>
                </div>

                <button id="newChatBtn" class="new-chat-btn">
                    <i class="fas fa-plus"></i>
                    New Chat
                </button>
            </div>


            <div id="chatMessages" class="chat-messages">

                <div class="welcome-screen" id="welcomeScreen">

                    <div class="welcome-icon">
                        <i class="fas fa-robot"></i>
                    </div>

                    <h1>Hello! Welcome to <span>AM Digital AI</span></h1>

                    <p>
                        Your intelligent assistant by AM Digital Studio.
                        Ask me anything and let's explore new ideas together.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion" data-prompt="What can you do?">
                            <i class="fas fa-lightbulb"></i>
                            What can you do?
                        </button>

                        <button class="suggestion" data-prompt="Explain Artificial Intelligence">
                            <i class="fas fa-brain"></i>
                            Explain Artificial Intelligence
                        </button>

                        <button class="suggestion" data-prompt="Help me create a website">
                            <i class="fas fa-code"></i>
                            Help me create a website
                        </button>

                        <button class="suggestion" data-prompt="Give me some creative ideas">
                            <i class="fas fa-wand-magic-sparkles"></i>
                            Creative ideas
                        </button>

                    </div>

                </div>

            </div>


            <div class="input-area">

                <form id="chatForm" class="chat-form">

                    <textarea
                        id="userInput"
                        placeholder="Message AM Digital AI..."
                        rows="1"
                        maxlength="4000"
                        required
                    ></textarea>

                    <button type="submit" id="sendBtn" class="send-btn">
                        <i class="fas fa-paper-plane"></i>
                    </button>

                </form>

                <p class="input-note">
                    AM Digital AI can make mistakes. Verify important information.
                </p>

            </div>

        </section>

    </main>


    <script src="amai.js"></script>

</body>
</html>
