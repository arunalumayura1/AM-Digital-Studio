
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1677ff">

    <title>Reset Password | AM Digital Studio</title>

    <link rel="stylesheet" href="account.css">

    <script src="account-theme.js" defer></script>
    <script type="module" src="reset-password.js"></script>
    <link rel="icon" type="image/png" href="wdf.png">
</head>

<body>

<header class="am-header">
    <a class="brand" href="index.html">
        AM <span>Digital Studio</span>
    </a>

    <nav class="am-nav">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>

        <button id="accountThemeToggle"
                class="theme-toggle"
                type="button">
            ☾ Dark Mode
        </button>
    </nav>
</header>

<main class="auth-wrap">

    <section class="auth-card">

        <span class="eyebrow">ACCOUNT SECURITY</span>

        <h1>Reset Password</h1>

        <p class="muted">
            Create a new password for your AM Digital Studio account.
        </p>

        <div id="resetNotice" class="notice" hidden></div>

        <form id="resetPasswordForm">

            <div class="field">
                <label for="newPassword">New Password</label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter new password"
                    required
                >
            </div>

            <div class="field">
                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Confirm new password"
                    required
                >
            </div>

            <button class="btn full" type="submit">
                Update Password
            </button>

        </form>

        <p class="auth-foot">
            <a href="login.html">Back to Login</a>
        </p>

    </section>

</main>

</body>
</html>
