<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1677ff"><title>Create Account | AM Digital Studio</title><link rel="stylesheet" href="account.css"><script type="module" src="signup.js"></script><script src="account-theme.js" defer></script></head><body>
<header class="am-header"><a class="brand" href="index.html">AM <span>Digital Studio</span></a><nav class="am-nav"><a href="index.html">Home</a><a href="tracking.html">Track Order</a><a href="login.html">Login</a><button id="accountThemeToggle" class="theme-toggle" type="button">☾ Dark Mode</button></nav></header>
<main class="auth-wrap"><section class="auth-card"><span class="eyebrow">JOIN AM DIGITAL STUDIO</span><h1>Create your account</h1><p class="muted">Register to keep your orders together in one secure place.</p><div id="signupNotice" class="notice" hidden></div><form id="signupForm"><div class="field"><label for="fullName">Full name</label><input id="fullName" type="text" autocomplete="name" maxlength="100" required placeholder="Your full name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat your password"></div><button class="btn full" id="signupButton" type="submit">Create Account</button></form><p class="auth-foot">Already registered? <a href="login.html">Sign in</a></p></section></main><footer class="footer-note">© 2026 AM Digital Studio · Sri Lanka</footer></body></html>
